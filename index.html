<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baromètre des paris</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root{
    --bg:#e8e6df; --fg:#17150f; --muted:#8a8578; --border:#cdc9bd;
    --accent:#0d6b2f;
    --pm:#2f6bff; --kalshi:#009a7b; --manifold:#6a4ff0;
    --track:#dcd9cf; --fill:rgba(23,21,15,.11);
    --rule:#17150f;
    --disp:'Bebas Neue','Oswald','Arial Narrow',sans-serif;
    --mono:'Space Mono',ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0c0b09; --fg:#e8e4d8; --muted:#807c70; --border:#2b2924;
    --accent:#44d06f; --pm:#5b8cff; --kalshi:#2ad4a6; --manifold:#9d8bf5;
    --track:#1b1915; --fill:rgba(232,228,216,.12); --rule:#e8e4d8;
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0c0b09; --fg:#e8e4d8; --muted:#807c70; --border:#2b2924;
    --accent:#44d06f; --pm:#5b8cff; --kalshi:#2ad4a6; --manifold:#9d8bf5;
    --track:#1b1915; --fill:rgba(232,228,216,.12); --rule:#e8e4d8;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--mono);line-height:1.5;
    padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  .wrap{max-width:none;width:100%;padding-bottom:56px}

  /* Masthead — statique, défile */
  .masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-block:16px 12px;border-bottom:3px solid var(--rule)}
  h1{font-family:var(--disp);font-weight:400;font-size:clamp(34px,8vw,64px);line-height:.86;letter-spacing:.015em;margin:0;text-transform:uppercase}
  .btn{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg);background:transparent;border:0;border-bottom:2px solid var(--fg);padding:1px 0 3px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;white-space:nowrap}
  .btn:hover{color:var(--accent);border-color:var(--accent)}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  .btn .ico{display:inline-block;font-size:13px}
  .btn.busy .ico{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.btn.busy .ico{animation:none}}
  .tools{display:flex;align-items:center;gap:16px;margin-bottom:8px}
  .lang{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.09em}
  .lang button{background:none;border:0;padding:0;cursor:pointer;font:inherit;color:var(--muted);text-transform:uppercase}
  .lang button[aria-pressed="true"]{color:var(--fg);text-decoration:underline;text-underline-offset:3px}
  .lang button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .lang .sep{color:var(--border)}

  /* Nav de catégories — collante, slim (remplace les onglets-pilules) */
  .navbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:2px solid var(--rule)}
  .tabs{display:flex;gap:16px;justify-content:space-between;overflow-x:auto;padding:10px 0 0;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;font-family:var(--disp);font-weight:400;font-size:22px;line-height:1;letter-spacing:.03em;color:var(--muted);background:transparent;border:0;padding:3px 0 10px;cursor:pointer;white-space:nowrap;text-transform:uppercase;position:relative}
  .tab:hover{color:var(--fg)}
  .tab[aria-selected="true"]{color:var(--fg)}
  .tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:3px;background:var(--fg)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Contrôles */
  .controls{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin:14px 0 26px}
  .chip{font-family:var(--mono);font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);background:transparent;border:0;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .chip::before{content:"";width:7px;height:7px;background:var(--accent)}
  .chip[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}
  .chip[aria-pressed="false"]::before{background:var(--muted)}
  .chip .dot{display:none}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .search{flex:1 1 240px;min-width:0}
  .search input{width:100%;font-family:var(--mono);font-size:13px;color:var(--fg);background:transparent;border:0;border-bottom:1px solid var(--border);padding:6px 0}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:none;border-bottom:1px solid var(--fg)}

  /* Sections par source */
  .lane{margin-bottom:48px}
  .lane[hidden]{display:none}
  .lane[data-source="polymarket"],.card[data-source="polymarket"]{--src:var(--pm)}
  .lane[data-source="kalshi"],.card[data-source="kalshi"]{--src:var(--kalshi)}
  .lane[data-source="manifold"],.card[data-source="manifold"]{--src:var(--manifold)}
  .sec-head{padding-bottom:7px;border-bottom:3px solid var(--src)}
  .sec-head h2{font-family:var(--disp);font-weight:400;font-size:28px;line-height:1;letter-spacing:.03em;margin:0;text-transform:uppercase;color:var(--src);display:flex;align-items:center;gap:9px}
  .sec-head h2 .sq{display:block;width:11px;height:11px;background:var(--src);flex:none}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));column-gap:38px;row-gap:0}
  .card{background:transparent;border:0;border-top:1px solid var(--border);border-radius:0;padding:14px 0 16px;box-shadow:none;display:flex;flex-direction:column;gap:9px;min-width:0}
  .card-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .badge{font-family:var(--mono);font-weight:700;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--src)}
  .vol{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-transform:uppercase}
  .card-title{font-family:var(--mono);font-weight:700;font-size:13px;line-height:1.35;margin:0;color:var(--fg)}
  a.card-title{text-decoration:none;border-bottom:1px solid transparent;transition:border-color .12s}
  a.card-title:hover{border-color:var(--src);color:var(--src)}
  .outcomes{display:flex;flex-direction:column;gap:3px;margin-top:1px}
  .oc{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
  .oc-track{position:relative;height:25px;background:var(--track);border-radius:0;overflow:hidden;display:flex;align-items:center;min-width:0}
  .oc-fill{position:absolute;top:0;left:0;bottom:0;background:var(--fill)}
  .oc.lead .oc-fill{background:color-mix(in srgb,var(--src) 26%,transparent)}
  .oc-label{position:relative;z-index:1;padding:0 8px;font-family:var(--mono);font-size:11.5px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .oc-pct{font-family:var(--disp);font-weight:400;font-size:20px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums;text-align:right;min-width:2.3em}
  .oc.lead .oc-pct{color:var(--src)}
  .card-foot{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--muted);padding-top:7px;margin-top:2px;text-transform:uppercase}
  .empty{grid-column:1/-1;color:var(--muted);font-family:var(--mono);font-size:12px;padding:16px 0 0}

  footer.foot{border-top:3px solid var(--rule);margin-top:12px;padding-top:12px;color:var(--muted);font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
  footer.foot b{color:var(--fg)} footer.foot .mono{font-family:var(--mono)} footer.foot a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>Baromètre des paris</h1>
    <div class="tools">
      <div class="lang" id="lang"><button type="button" data-lang="fr" aria-pressed="true">FR</button><span class="sep">/</span><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
      <button class="btn" id="refresh" type="button"><span class="ico">↻</span> <span id="reftxt">Rafraîchir</span></button>
    </div>
  </header>
  <nav class="navbar"><div class="tabs" id="tabs" role="tablist"></div></nav>
  <div class="controls">
    <label class="search"><input id="q" type="search" placeholder="Rechercher dans tout le catalogue (ex. le pen, bitcoin, super bowl)…" autocomplete="off"></label>
  </div>

  <section class="lane" data-source="polymarket" id="sec-polymarket">
    <div class="sec-head"><h2><span class="sq"></span>Polymarket</h2></div>
    <div class="grid"></div>
  </section>
  <section class="lane" data-source="kalshi" id="sec-kalshi">
    <div class="sec-head"><h2><span class="sq"></span>Kalshi</h2></div>
    <div class="grid"></div>
  </section>
  <section class="lane" data-source="manifold" id="sec-manifold">
    <div class="sec-head"><h2><span class="sq"></span>Manifold</h2></div>
    <div class="grid"></div>
  </section>

  <footer class="foot">cotes indicatives pour recherche uniquement, pas un conseil d'investissement</footer>
</div>

<script>
(function(){
  "use strict";
  var CATS=[['trending','Trending',null],['politique','Politique','politics'],['crypto','Crypto','crypto'],['sport','Sport','sports'],['eco','Éco & Finance','economy'],['culture','Culture','pop-culture'],['monde','Monde','world'],['tech','Tech & Science','tech']];
  function catSlug(k){for(var i=0;i<CATS.length;i++)if(CATS[i][0]===k)return CATS[i][2];return k;}
  var pmLive={}, pmSeq=0;
  var SOURCES=['polymarket','kalshi','manifold'];
  var DATA=null, active='trending', query='';
  var T={
    fr:{title:'Baromètre des paris',refresh:'Rafraîchir',searchPh:'Rechercher dans tout le catalogue (ex. le pen, bitcoin, super bowl)…',resolution:'Résolution',loading:'Chargement…',loadingLive:'Chargement en direct…',searchingLive:'Recherche en direct…',noMarket:'Aucun marché dans cette catégorie.',noResult:'Aucun résultat.',srcUnavail:'Source indisponible à la dernière collecte.',pmUnavail:'Polymarket indisponible — réessaie « Rafraîchir ».',footer:'cotes indicatives pour recherche uniquement, pas un conseil d’investissement',cats:{trending:'Tendances',politique:'Politique',crypto:'Crypto',sport:'Sport',eco:'Éco & Finance',culture:'Culture',monde:'Monde',tech:'Tech & Science'}},
    en:{title:'Betting Barometer',refresh:'Refresh',searchPh:'Search the whole catalogue (e.g. le pen, bitcoin, super bowl)…',resolution:'Resolves',loading:'Loading…',loadingLive:'Loading live…',searchingLive:'Searching live…',noMarket:'No markets in this category.',noResult:'No results.',srcUnavail:'Source unavailable at last collection.',pmUnavail:'Polymarket unavailable — try Refresh.',footer:'odds for research only, not investment advice',cats:{trending:'Trending',politique:'Politics',crypto:'Crypto',sport:'Sports',eco:'Econ & Finance',culture:'Culture',monde:'World',tech:'Tech & Science'}}
  };
  var lang='fr';try{lang=localStorage.getItem('lang')||((navigator.language||'').slice(0,2)==='en'?'en':'fr');}catch(e){}
  function tr(k){return (T[lang]||T.fr)[k];}
  function catLabel(k){return (T[lang]||T.fr).cats[k];}

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fmtDate(d){if(d==null||d==='')return '';var t=typeof d==='number'?d:Date.parse(d);if(!isFinite(t))return '';try{return new Date(t).toLocaleDateString(lang==='en'?'en-GB':'fr-FR',{day:'numeric',month:'short',year:'numeric'});}catch(e){return '';}}

  function cardHTML(it){
    var titleHTML=it.u?'<a class="card-title" href="'+esc(it.u)+'" target="_blank" rel="noopener">'+esc(it.t)+'</a>':'<h3 class="card-title">'+esc(it.t)+'</h3>';
    var rows=(it.o||[]).map(function(o,i){var w=Math.max(2,Math.min(100,Math.round(o.p*100)));return '<div class="oc'+(i===0?' lead':'')+'"><div class="oc-track"><div class="oc-fill" style="width:'+w+'%"></div><span class="oc-label" title="'+esc(o.l)+'">'+esc(o.l)+'</span></div><span class="oc-pct">'+Math.round(o.p*100)+'%</span></div>';}).join('');
    var end=fmtDate(it.e);
    return '<article class="card" data-source="'+esc(it.s)+'"><header class="card-head"><span class="badge">'+esc(it.s)+'</span><span class="vol">'+esc(it.m||'')+'</span></header>'+titleHTML+'<div class="outcomes">'+rows+'</div>'+(end?'<footer class="card-foot">'+tr('resolution')+' '+end+'</footer>':'')+'</article>';
  }
  function laneRender(src,items,label){
    document.querySelector('#sec-'+src+' .grid').innerHTML=items.length?items.map(cardHTML).join(''):'<div class="empty">'+(label||'Aucun marché.')+'</div>';
  }
  function setStatus(){}

  function bySrc(items){var g={polymarket:[],kalshi:[],manifold:[]};items.forEach(function(x){if(g[x.s])g[x.s].push(x);});return g;}

  function byV(a,b){return (b.v||0)-(a.v||0);}
  function dedupe(items){var seen={};return items.filter(function(x){var k=x.s+'|'+x.t;if(seen[k])return false;seen[k]=1;return true;});}

  // ---- vue par catégorie (sur l'instantané collecté) ----
  function render(){
    if(!DATA){SOURCES.forEach(function(s){document.querySelector('#sec-'+s+' .grid').innerHTML='<div class="empty">'+tr('loading')+'</div>';});return;}
    if(query.length>=2)return; // la recherche est gérée en direct par runSearch()
    var pool=active==='trending'?dedupe(DATA.all):DATA.all.filter(function(x){return x.c===active;});
    var g=bySrc(pool);
    ['kalshi','manifold'].forEach(function(s){
      var arr=g[s].slice().sort(byV).slice(0,40);
      var srcOk=!DATA.sources||!DATA.sources[s]||DATA.sources[s].ok;
      laneRender(s,arr,srcOk?tr('noMarket'):tr('srcUnavail'));
    });
    renderPMcat(active);
  }
  function renderPMcat(cat){
    if(pmLive[cat]){laneRender('polymarket',pmLive[cat],tr('noMarket'));return;}
    document.querySelector('#sec-polymarket .grid').innerHTML='<div class="empty">'+tr('loadingLive')+'</div>';
    var seq=++pmSeq, c=cat;
    loadPMcat(c).then(function(it){pmLive[c]=it;try{localStorage.setItem('pm_'+c,JSON.stringify(it));}catch(e){}if(c!==active||seq!==pmSeq||query.length>=2)return;laneRender('polymarket',it,tr('noMarket'));})
    .catch(function(){if(c!==active||seq!==pmSeq||query.length>=2)return;var f=DATA.all.filter(function(x){return x.s==='polymarket'&&x.c===c;}).sort(byV).slice(0,40);if(!f.length){try{f=JSON.parse(localStorage.getItem('pm_'+c))||[];}catch(e){f=[];}}laneRender('polymarket',f,tr('pmUnavail'));});
  }
  async function loadPMcat(cat){var base='https://gamma-api.polymarket.com/events?closed=false&limit=24&order=volume24hr&ascending=false';var url=cat==='trending'?base:base+'&tag_slug='+catSlug(cat);var d=await jget(url);return pmParse(d).sort(byV).slice(0,40);}

  // ---- recherche EN DIRECT sur tout le catalogue ----
  var JINA='https://r.jina.ai/', sseq=0;
  async function jget(url){var r=await fetch(JINA+url,{headers:{'x-respond-with':'text'}});if(!r.ok)throw new Error('HTTP '+r.status);return JSON.parse(await r.text());}
  function money(n){n=+n||0;if(n>=1e9)return '$'+(n/1e9).toFixed(1)+'B vol';if(n>=1e6)return '$'+(n/1e6).toFixed(1)+'M vol';if(n>=1e3)return '$'+(n/1e3).toFixed(0)+'k vol';return '$'+n.toFixed(0)+' vol';}
  function comp(n){n=+n||0;if(n>=1e6)return (n/1e6).toFixed(1)+'M';if(n>=1e3)return (n/1e3).toFixed(0)+'k';return n.toFixed(0);}
  function pmParse(evs){return (evs||[]).map(function(e){var ms=e.markets||[],outs=[];for(var i=0;i<ms.length;i++){var m=ms[i];if(m.closed)continue;var pr;try{pr=JSON.parse(m.outcomePrices||'[]');}catch(x){continue;}if(!pr.length)continue;var y=parseFloat(pr[0]);if(!isFinite(y))continue;outs.push({l:ms.length>1?(m.groupItemTitle||m.question):'Oui',p:Math.round(y*1e4)/1e4});}if(outs.length>1){var ps=outs.map(function(o){return o.p;});var mn=Math.min.apply(null,ps),mx=Math.max.apply(null,ps),sm=ps.reduce(function(a,b){return a+b;},0);if(mx-mn<0.02||sm>1.8)return null;}outs=outs.filter(function(o){return !/^(person|candidate|outcome|team|option|choice|player|entrant|contestant)\s*([a-z]|\d{1,3})$/i.test(String(o.l).trim());});if(!outs.length)return null;outs.sort(function(a,b){return b.p-a.p;});return {s:'polymarket',t:e.title,u:e.slug?('https://polymarket.com/event/'+e.slug):'',e:e.endDate||'',v:+e.volume||0,m:money(+e.volume),o:outs.slice(0,6)};}).filter(Boolean);}
  function manParse(arr){return (arr||[]).filter(function(m){return typeof m.probability==='number'&&!m.isResolved;}).map(function(m){return {s:'manifold',t:m.question,u:m.url,e:m.closeTime||'',v:+m.volume||0,m:'Ṁ'+comp(+m.volume||0),o:[{l:'Oui',p:Math.round(m.probability*1e4)/1e4}]};});}
  async function searchPM(q){var r=await fetch(JINA+'https://gamma-api.polymarket.com/public-search?q='+encodeURIComponent(q)+'&limit_per_type=25&events_status=active',{headers:{'x-respond-with':'text'}});if(!r.ok)throw new Error('HTTP '+r.status);var d=JSON.parse(await r.text());return pmParse((d&&d.events)||[]).sort(byV);}
  async function searchMan(q){var r=await fetch('https://api.manifold.markets/v0/search-markets?term='+encodeURIComponent(q)+'&limit=25&sort=liquidity&filter=open&contractType=BINARY');if(!r.ok)throw new Error('HTTP '+r.status);return manParse(await r.json());}
  function collected(src,q){return DATA?dedupe(DATA.all.filter(function(x){return x.s===src&&x._h.indexOf(q)>=0;}).sort(byV)):[];}
  function runSearch(q){
    var seq=++sseq;
    document.querySelector('#sec-polymarket .grid').innerHTML='<div class="empty">'+tr('searchingLive')+'</div>';
    document.querySelector('#sec-manifold .grid').innerHTML='<div class="empty">'+tr('searchingLive')+'</div>';
    var k=collected('kalshi',q);laneRender('kalshi',k,tr('noResult'));
    searchPM(q).then(function(it){if(seq!==sseq)return;it=dedupe(it);laneRender('polymarket',it,tr('noResult'));})
      .catch(function(){if(seq!==sseq)return;var f=collected('polymarket',q);laneRender('polymarket',f,tr('noResult'));});
    searchMan(q).then(function(it){if(seq!==sseq)return;it=dedupe(it);laneRender('manifold',it,tr('noResult'));})
      .catch(function(){if(seq!==sseq)return;var f=collected('manifold',q);laneRender('manifold',f,tr('noResult'));});
  }

  // nav catégories
  var tabsEl=document.getElementById('tabs');
  CATS.forEach(function(c){var b=document.createElement('button');b.className='tab';b.textContent=catLabel(c[0]);b.dataset.cat=c[0];b.setAttribute('role','tab');b.setAttribute('aria-selected',c[0]===active?'true':'false');b.addEventListener('click',function(){active=c[0];query='';sseq++;document.getElementById('q').value='';updateTabs();render();});tabsEl.appendChild(b);});
  function updateTabs(){Array.prototype.forEach.call(tabsEl.children,function(b){b.setAttribute('aria-selected',b.dataset.cat===active?'true':'false');});}
  function applyStatic(){var t=T[lang]||T.fr;document.querySelector('h1').textContent=t.title;document.getElementById('reftxt').textContent=t.refresh;document.getElementById('q').placeholder=t.searchPh;document.querySelector('.foot').textContent=t.footer;Array.prototype.forEach.call(tabsEl.children,function(b){b.textContent=t.cats[b.dataset.cat];});Array.prototype.forEach.call(document.querySelectorAll('#lang button'),function(b){b.setAttribute('aria-pressed',b.dataset.lang===lang?'true':'false');});try{document.documentElement.lang=lang;}catch(e){}}
  Array.prototype.forEach.call(document.querySelectorAll('#lang button'),function(b){b.addEventListener('click',function(){lang=b.dataset.lang;try{localStorage.setItem('lang',lang);}catch(e){}applyStatic();if(query.length>=2)runSearch(query);else render();});});

  // recherche
  var dq;document.getElementById('q').addEventListener('input',function(e){query=e.target.value.trim().toLowerCase();clearTimeout(dq);if(query.length>=2){dq=setTimeout(function(){runSearch(query);},300);}else{sseq++;dq=setTimeout(render,100);}});

  // data
  var btn=document.getElementById('refresh');
  function prep(d){ (d.all||[]).forEach(function(x){x._h=((x.t||'')+' '+(x.o||[]).map(function(o){return o.l;}).join(' ')).toLowerCase();}); return d; }
  async function loadData(bust){
    btn.classList.add('busy');btn.disabled=true;
    try{
      var r=await fetch('data.json'+(bust?('?t='+Date.now()):''),{cache:bust?'reload':'default'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      DATA=prep(await r.json());
    }catch(e){
      if(!DATA)DATA={all:[],sources:{}};
    }
    if(query.length>=2)runSearch(query);else render();
    btn.classList.remove('busy');btn.disabled=false;
  }
  btn.addEventListener('click',function(){pmLive={};pmSeq++;loadData(true);});

  applyStatic();
  render();
  loadData(false);
})();
</script>
