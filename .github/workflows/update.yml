name: Update odds

on:
  schedule:
    - cron: '0 7,19 * * *'   # 2×/jour : 07:00 et 19:00 UTC
  workflow_dispatch:          # bouton "Run workflow" manuel

permissions:
  contents: write

concurrency:
  group: update-odds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch odds (API directes, runner US)
        run: node fetch.mjs
      - name: Commit data.json
        run: |
          git config user.name  "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          if git status --porcelain data.json | grep -q .; then
            git add data.json
            git commit -m "data: refresh odds ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "Aucun changement."
          fi
