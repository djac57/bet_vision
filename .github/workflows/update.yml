name: Update odds

on:
  schedule:
    - cron: '0 7,19 * * *'   # 2×/jour : 07:00 et 19:00 UTC
  workflow_dispatch:          # bouton "Run workflow" manuel
  push:
    branches: [ main ]        # déploie dès le premier push

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch odds (API directes, runner US)
        run: node fetch.mjs
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html data.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
